name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore NeteaseMusicCloudMatch.sln

      - name: Build
        run: dotnet build NeteaseMusicCloudMatch.sln --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test NeteaseMusicCloudMatch.sln --configuration Release --no-build --no-restore
